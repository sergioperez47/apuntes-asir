<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plataforma de Cuestionarios</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
        .btn-siguiente, .btn-anterior { padding: 15px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; flex: 1; }
        .btn-siguiente { background: #007bff; }
        .btn-anterior { background: #555; }
        .navigation-wrapper { display: flex; gap: 10px; margin-top: 20px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .correcto { background: #155724 !important; border: 2px solid #28a745 !important; }
        .incorrecto { background: #721c24 !important; border: 2px solid #dc3545 !important; }
    </style>
</head>
<body>
<div class="card" id="main-container">
    <select id="selector-test">
        <option value="repaso_script_1">📜 Script Bash: Repaso Final</option>
        <option value="repaso_script_2">📜 Script Bash 2: Repaso Final</option>

    </select>
    <button onclick="comenzarTest('practica')">MODO PRÁCTICA</button>
    <button onclick="comenzarTest('examen')">MODO EXAMEN</button>
</div>

<script>
    let preguntas = [], indiceActual = 0, modoSeleccionado = '', respuestasUsuario = {};

    function comenzarTest(modo) {
        modoSeleccionado = modo;
        const testElegido = document.getElementById('selector-test').value;
        fetch(`./${testElegido}.json`)
            .then(res => res.json())
            .then(data => {
                preguntas = data;
                indiceActual = 0;
                renderizarJuego();
            });
    }

    function renderizarJuego() {
        document.getElementById('main-container').innerHTML = `
            <h2 id="pregunta"></h2>
            <div id="opciones"></div>
            <div id="wrapper-navegacion" class="navigation-wrapper"></div>
        `;
        mostrarPregunta();
    }

    function mostrarPregunta() {
        let p = preguntas[indiceActual];
        document.getElementById('pregunta').innerText = p.pregunta;
        let cont = document.getElementById('opciones');
        cont.innerHTML = '';
        p.opciones.forEach(opc => {
            let b = document.createElement('button');
            b.innerText = opc;
            b.onclick = () => registrarRespuesta(b, opc, p.respuesta_correcta);
            cont.appendChild(b);
        });
        actualizarBotonesNavegacion();
    }

    function registrarRespuesta(b, opc, correct) {
        respuestasUsuario[indiceActual] = opc;
        if (modoSeleccionado === 'practica') {
            Array.from(b.parentNode.children).forEach(btn => btn.disabled = true);
            b.classList.add(opc.startsWith(correct) ? 'correcto' : 'incorrecto');
        }
    }

    function actualizarBotonesNavegacion() {
        let nav = document.getElementById('wrapper-navegacion');
        nav.innerHTML = ''; // Limpieza total para evitar duplicados

        if (indiceActual > 0) {
            let ant = document.createElement('button');
            ant.className = 'btn-anterior';
            ant.innerText = '⬅️ Anterior';
            ant.onclick = () => { indiceActual--; mostrarPregunta(); };
            nav.appendChild(ant);
        }

        if (indiceActual < preguntas.length - 1) {
            let sig = document.createElement('button');
            sig.className = 'btn-siguiente';
            sig.innerText = 'Siguiente ➡️';
            sig.onclick = () => { indiceActual++; mostrarPregunta(); };
            nav.appendChild(sig);
        }
    }
</script>
</body>
</html>
