<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Informática - ASIR</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 90vh;
            margin: 0;
        }
        .card { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            max-width: 600px; 
            width: 100%; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
        }
        .progress-bar {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        h2 {
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        button { 
            display: block; 
            width: 100%; 
            margin: 12px 0; 
            padding: 14px; 
            background: #2a2a2a; 
            color: white; 
            border: 2px solid #3a3a3a; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 16px; 
            transition: all 0.2s ease;
        }
        button:hover:not(:disabled) { 
            background: #007bff; 
            border-color: #0056b3;
            transform: translateX(5px);
        }
        /* Estilos para Feedback instantáneo (Modo Práctica) */
        button.correcto {
            background: #155724 !important;
            border-color: #28a745 !important;
            color: #d4edda !important;
        }
        button.incorrecto {
            background: #721c24 !important;
            border-color: #dc3545 !important;
            color: #f8d7da !important;
        }
        .btn-siguiente {
            background: #007bff;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn-siguiente:hover {
            background: #0056b3;
        }
        /* Pantalla de Inicio y Resultado */
        .menu-box, .resultado-box {
            text-align: center;
            padding: 10px;
        }
        .menu-box h1 {
            color: #007bff;
            margin-bottom: 10px;
        }
        .menu-box p {
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn-modo {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            background: #252d3a;
            border-color: #007bff;
            margin: 20px 0;
            padding: 20px;
        }
        .btn-modo:hover {
            background: #007bff;
        }
        .resultado-box h3 {
            margin: 0 0 15px 0;
            color: #007bff;
            font-size: 24px;
        }
        .puntuacion {
            font-size: 32px;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 15px;
        }
        .btn-reiniciar {
            background: #28a745;
            border: none;
            text-align: center;
            font-weight: bold;
            display: inline-block;
            width: auto;
            padding: 10px 25px;
            margin-top: 15px;
        }
        .btn-reiniciar:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="card" id="main-container">
    <div class="menu-box">
        <h1>Test de Informática ASIR</h1>
        <p>Selecciona cómo quieres realizar el cuestionario:</p>
        <button class="btn-modo" onclick="comenzarTest('practica')">📖 MODO PRÁCTICA<br><span style="font-size:12px; font-weight:normal; color:#ccc;">Verás si aciertas o fallas en cada pregunta al instante.</span></button>
        <button class="btn-modo" onclick="comenzarTest('examen')">📝 MODO EXAMEN<br><span style="font-size:12px; font-weight:normal; color:#ccc;">Responderás del tirón y verás la nota final en un recuadro.</span></button>
    </div>
</div>

<script>
    let preguntas = [];
    let indiceActual = 0;
    let aciertos = 0;
    let modoSeleccionado = ''; // 'practica' o 'examen'
    let respondido = false; // Bloqueo para evitar doble clic en modo práctica

    // Guardar la estructura del juego para meterla dinámicamente
    const estructuraJuegoHTML = `
        <div class="progress-bar">
            <span id="modo-texto">Modo</span>
            <span id="progreso">Pregunta 0 de 0</span>
        </div>
        <h2 id="pregunta">Cargando pregunta...</h2>
        <div id="opciones"></div>
        <div id="wrapper-siguiente"></div>
    `;

    function comenzarTest(modo) {
        modoSeleccionado = modo;
        
        // Cambiar la pantalla del menú por la del test
        document.getElementById('main-container').innerHTML = estructuraJuegoHTML;
        document.getElementById('modo-texto').innerText = modo === 'practica' ? '📖 Modo Práctica' : '📝 Modo Examen';

        // Cargar las preguntas del JSON
        fetch('preguntas_informatica_54.json')
            .then(res => res.json())
            .then(data => {
                preguntas = data.sort(() => Math.random() - 0.5); // Mezclar aleatoriamente
                mostrarPregunta();
            });
    }

    function mostrarPregunta() {
        respondido = false;
        if (indiceActual >= preguntas.length) {
            mostrarResultadoFinal();
            return;
        }

        document.getElementById('progreso').innerText = `Pregunta ${indiceActual + 1} de ${preguntas.length}`;
        document.getElementById('wrapper-siguiente').innerHTML = ''; // Limpiar botón Siguiente si lo hubiera

        let p = preguntas[indiceActual];
        document.getElementById('pregunta').innerText = p.pregunta;
        
        let opcionesDiv = document.getElementById('opciones');
        opcionesDiv.innerHTML = '';
        
        p.opciones.forEach(opcion => {
            let boton = document.createElement('button');
            boton.innerText = opcion;
            let letra = opcion.trim().charAt(0).toUpperCase(); 
            
            boton.onclick = () => procesarRespuesta(boton, letra, p.respuesta_correcta);
            opcionesDiv.appendChild(boton);
        });
    }

    function procesarRespuesta(botonSeleccionado, letraElegida, letraCorrecta) {
        if (respondido && modoSeleccionado === 'practica') return; // Evita clicks repetidos en modo práctica

        let esCorrecto = (letraElegida === letraCorrecta.toUpperCase());
        
        if (esCorrecto) {
            aciertos++;
        }

        if (modoSeleccionado === 'examen') {
            // Modo Examen: Pasa a la siguiente pregunta en silencio
            indiceActual++;
            mostrarPregunta();
        } else {
            // Modo Práctica: Mostrar respuestas correcta/incorrecta visualmente
            respondido = true;
            let botones = document.querySelectorAll('#opciones button');
            
            botones.forEach(b => {
                b.disabled = true; // Desactivar todos los botones temporalmente
                let letraBoton = b.innerText.trim().charAt(0).toUpperCase();
                
                if (letraBoton === letraCorrecta.toUpperCase()) {
                    b.classList.add('correcto'); // Pintar la correcta de verde
                }
            });

            if (!esCorrecto) {
                botonSeleccionado.classList.add('incorrecto'); // Si falló, pintar su elección de rojo
            }

            // Crear dinámicamente un botón para avanzar cuando el usuario esté listo
            let btnSiguiente = document.createElement('button');
            btnSiguiente.className = 'btn-siguiente';
            btnSiguiente.innerText = 'Siguiente Pregunta ➡️';
            btnSiguiente.onclick = () => {
                indiceActual++;
                mostrarPregunta();
            };
            document.getElementById('wrapper-siguiente').appendChild(btnSiguiente);
        }
    }

    function mostrarResultadoFinal() {
        const contenedor = document.getElementById('main-container');
        let porcentaje = Math.round((aciertos / preguntas.length) * 100);
        let mensajeMotivacional = porcentaje >= 50 ? "¡Enhorabuena! Has aprobado el examen. 🎉" : "Te falta un empujón. ¡Sigue repasando! 📚";

        contenedor.innerHTML = `
            <div class="resultado-box">
                <h3>¡Test Finalizado!</h3>
                <p>Modo completado: <strong>${modoSeleccionado === 'practica' ? 'Práctica' : 'Examen'}</strong></p>
                <div class="puntuacion">Tu puntuación total ha sido: ${aciertos} / ${preguntas.length}</div>
                <p>Porcentaje de aciertos: <strong>${porcentaje}%</strong></p>
                <p>${mensajeMotivacional}</p>
                <button class="btn-reiniciar" onclick="window.location.reload()">Volver al Menú</button>
            </div>
        `;
    }
</script>

</body>
</html>
