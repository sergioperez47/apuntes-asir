<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Informática</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { display: block; width: 100%; margin: 10px 0; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; text-align: left; font-size: 16px; }
        button:hover { background: #0056b3; }
        #resultado { font-weight: bold; margin-top: 15px; font-size: 18px; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="pregunta">Cargando preguntas...</h2>
    <div id="opciones"></div>
    <div id="resultado"></div>
</div>

<script>
    let preguntas = [];
    let indiceActual = 0;
    let aciertos = 0;

    // Cargar el JSON desde tu propio repositorio
    fetch('preguntas_informatica_54.json')
        .then(res => res.json())
        .then(data => {
            preguntas = data.sort(() => Math.random() - 0.5); // Mezclar preguntas
            mostrarPregunta();
        });

    function mostrarPregunta() {
        document.getElementById('resultado').innerText = '';
        if (indiceActual >= preguntas.length) {
            document.getElementById('pregunta').innerText = "¡Test Completado!";
            document.getElementById('opciones').innerHTML = `Tu puntuación es: ${aciertos} de ${preguntas.length}`;
            return;
        }

        let p = preguntas[indiceActual];
        document.getElementById('pregunta').innerText = p.pregunta;
        
        let opcionesDiv = document.getElementById('opciones');
        opcionesDiv.innerHTML = '';
        
        p.opciones.forEach(opcion => {
            let boton = document.createElement('button');
            boton.innerText = opcion;
            // Extrae la letra (A, B, C, D) del inicio de la opción
            let letra = opcion.charAt(0).toUpperCase(); 
            boton.onclick = () => verificarRespuesta(letra, p.respuesta_correcta);
            opcionesDiv.appendChild(boton);
        });
    }

    function verificarRespuesta(elegida, correcta) {
        if (elegida === correcta) {
            aciertos++;
            alert("¡Correcto! 🎉");
        } else {
            alert(`Incorrecto ❌. La respuesta correcta era la ${correcta}`);
        }
        indiceActual++;
        mostrarPregunta();
    }
</script>

</body>
</html>
